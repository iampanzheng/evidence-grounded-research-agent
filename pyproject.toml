[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "p2-evidence-research-agent"
version = "0.0.1"
description = "Evidence-grounded Research Agent (Stage 0 engineering foundation)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph==1.2.15",
    "fastapi==0.142.2",
    "uvicorn==0.48.0",
]
[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
pgvector = [
    "psycopg[binary]>=3.2,<4",
]
[project.scripts]
p2 = "p2_research.cli.main:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "httpx==0.28.1"]
[tool.hatch.build.targets.wheel]
packages = ["src/p2_research"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = ["unit: deterministic unit tests", "contract: public interface contracts", "architecture: import boundary checks", "integration: integration tests", "security: security tests", "online: network-requiring tests", "slow: slower tests", "e2e: end-to-end tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src/p2_research"]
strict = true
